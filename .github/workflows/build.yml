name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Debug env
        run: |
          echo "JAVA_OPTS=[$JAVA_OPTS]"
          echo "GRADLE_OPTS=[$GRADLE_OPTS]"
          echo "_JAVA_OPTIONS=[$_JAVA_OPTIONS]"
          echo "JAVA_TOOL_OPTIONS=[$JAVA_TOOL_OPTIONS]"

      - name: Restore Gradle Wrapper JAR
        run: |
          set -euo pipefail

          PROPERTIES="gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$PROPERTIES" ]; then
            echo "Gradle wrapper properties are missing"
            exit 1
          fi

          VERSION="$(sed -n 's#.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*#\1#p' "$PROPERTIES" | head -n1)"

          if [ -z "$VERSION" ]; then
            echo "Could not detect Gradle version"
            exit 1
          fi

          echo "Preparing Gradle $VERSION"

          WORKDIR="$RUNNER_TEMP/gradle-wrapper-recovery"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"

          curl --retry 3 -fsSL \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            -o gradle.zip

          curl --retry 3 -fsSL \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip.sha256" \
            -o gradle.zip.sha256

          EXPECTED="$(tr -d '[:space:]' < gradle.zip.sha256)"

          if ! echo "$EXPECTED" | grep -qE '^[a-fA-F0-9]{64}$'; then
            echo "Invalid Gradle distribution checksum"
            exit 1
          fi

          printf '%s  gradle.zip\n' "$EXPECTED" | sha256sum --check -

          unzip -q gradle.zip

          mkdir -p generator
          cd generator

          printf "rootProject.name = 'wrapper-generator'\n" > settings.gradle

          "$WORKDIR/gradle-${VERSION}/bin/gradle" \
            --no-daemon wrapper \
            --gradle-version "$VERSION" \
            --distribution-type bin

          mkdir -p "$GITHUB_WORKSPACE/gradle/wrapper"

          cp gradle/wrapper/gradle-wrapper.jar \
            "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar"

          jar tf "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar" > /dev/null

          echo "Gradle Wrapper JAR generated and verified"
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
